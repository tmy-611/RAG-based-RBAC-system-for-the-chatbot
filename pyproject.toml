[project]
name = "ds-rpc-01"
version = "0.1.0"
description = "Starter project for the RPC-01: Internal Chatbot with Role Based Access Control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Backend API
    "fastapi[standard]>=0.115.12",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    # Frontend (calls FastAPI over HTTP)
    "streamlit>=1.37.0",
    "requests>=2.32.0",
    # LLM orchestration + Groq (openai/gpt-oss-120b main, openai/gpt-oss-20b router)
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.2.0",
    "groq>=0.11.0",
    # Embeddings + Vector DB (HuggingFace all-MiniLM-L6-v2 + ChromaDB local)
    "langchain-huggingface>=0.1.0",
    "langchain-chroma>=0.2.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    # Document parsing (.md via Docling, .csv via LangChain CSVLoader)
    "docling>=2.0.0",
    # Guardrails (PII masking; out-of-scope via prompt router, no extra dep)
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    # Relational DB: Supabase only (users/auth + RBAC roles via supabase-py)
    "supabase>=2.0.0",
    # Observability & Eval
    "langsmith>=0.1.0",
    "ragas>=0.2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
